version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vibeverse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibeverse
      POSTGRES_PASSWORD: vibeverse_dev_password
      POSTGRES_DB: vibeverse
    ports:
      - "5432:5432"
    volumes:
      - vibeverse_pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  vibeverse_pg_data:
